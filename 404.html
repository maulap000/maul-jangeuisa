<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#1c2840">
<title>페이지를 찾을 수 없습니다 — 마을장의사</title>
<style>
:root{--navy:#1c2840;--gold:#a8895a;--gold-light:#c8a870;--paper:#f7f5f0;--line:rgba(28,40,64,0.14);--gray:#6b7280;--text:#252832;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--paper);line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(10,18,35,0.97);display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
.topbar a{text-decoration:none;}
.brand{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:700;color:#fff;letter-spacing:0.08em;}
.brand em{color:var(--gold-light);font-style:normal;}
.call{border:1px solid rgba(168,137,90,0.5);color:var(--gold-light);padding:7px 14px;border-radius:50px;font-size:0.88rem;font-weight:700;}
main{max-width:560px;margin:0 auto;padding:120px 20px 64px;}
h1{font-family:'Noto Serif KR',serif;font-size:1.5rem;color:var(--navy);margin-bottom:12px;}
p{color:var(--gray);margin-bottom:28px;}
ul{list-style:none;border-top:1px solid var(--line);}
li{border-bottom:1px solid var(--line);}
li a{display:flex;justify-content:space-between;padding:14px 4px;color:var(--navy);text-decoration:none;font-weight:500;}
li a::after{content:"›";color:var(--gold);}
.cta{margin-top:32px;text-align:center;}
.cta a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:14px 28px;border-radius:50px;font-weight:700;}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/">마을<em>장의사</em></a>
<a class="call" href="tel:18771852">1877-1852</a>
</header>
<main>
<h1>찾으시는 페이지가 없습니다</h1>
<p>주소가 바뀌었거나 잘못 입력되었을 수 있습니다. 아래에서 필요한 안내를 찾아 주세요.</p>
<ul>
<li><a href="/">처음 화면</a></li>
<li><a href="/mubinso">무빈소 장례</a></li>
<li><a href="/small">작은 장례</a></li>
<li><a href="/normal">일반 장례</a></li>
<li><a href="/process">장례 진행 절차</a></li>
<li><a href="/faq">자주 묻는 질문</a></li>
</ul>
<div class="cta"><a href="tel:18771852">전화 상담 1877-1852</a></div>
</main>
</body>
</html>
